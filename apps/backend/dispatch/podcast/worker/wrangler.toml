name = "dispatch-podcast-proxy"
main = "src/worker.ts"
compatibility_date = "2026-05-10"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "dispatch-media"

# Secrets (set via `wrangler secret put`):
#   AUTH_USERNAME    — basic-auth username
#   AUTH_PASSWORD    — basic-auth password

# Bind the worker to a hostname you own, e.g.:
# [[routes]]
# pattern = "podcasts.example.com/*"
# zone_name = "example.com"
