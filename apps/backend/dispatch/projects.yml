# Dispatch project registry — order matters.
# Active projects render first, held next, archived hidden from home.
#
# This file ships with three showcase projects. After your first boot, edit
# this file (and restart) or use the admin Projects page to add your own.
#
# Display-name resolution order (see apps/backend/dispatch/registry/resolve.py):
#   1. Explicit `display_name` here (this file is the override layer)
#   2. First H1 of `<local_path>/README.md` (auto-discovered if local_path is set)
#   3. Titleize slug, respecting acronyms in registry/acronyms.yml
#
# Schema reference for each project entry:
#   slug          (required, kebab-case, primary key)
#   display_name  (optional, overrides H1/titleize)
#   github        (optional, "owner/repo" — required if you want GitHub ingest)
#   local_path    (optional, absolute path to a local clone for git-log ingest)
#   status        active | held | archived
#   kind          app | tool | service | site | agents | meta | library
#   summary       (optional, one-paragraph project description)
#   podcast       (optional, per-project podcast configuration)
#     title, description, author, itunes_category, cover_art (path, optional)
#     cron          (when to compose, in classic cron syntax)
#     compose_window_days  (lookback for episode content)
#     enabled       (bool)

version: 1
timezone: UTC

projects:
  - slug: claude-code
    display_name: Claude Code
    github: anthropics/claude-code
    status: active
    kind: tool
    summary: Anthropic's official command-line interface for Claude. Active daily; pairs an AI agent with the developer's terminal, repo, and IDE integrations.

  - slug: astro
    display_name: Astro
    github: withastro/astro
    status: active
    kind: app
    summary: All-in-one web framework for content-driven sites. Steady weekly cadence with a healthy mix of feature PRs, releases, and docs work.

  - slug: dispatch
    display_name: Dispatch
    github: markdavidgan/dispatch
    status: active
    kind: meta
    summary: This repository — a self-hosted daily editorial brief generator. Included as a meta example so the instance reports on its own development activity.

  - slug: dispatch-weekly
    display_name: Dispatch Weekly
    status: active
    kind: meta
    summary: Cross-project weekly podcast — NotebookLM composes one 25–30 minute episode from the week's daily briefings, surfacing themes that span projects rather than reciting per-day activity.
    podcast:
      title: "Dispatch Weekly"
      description: "Weekly cross-project digest. One episode picks the best insights from every project Dispatch tracks, woven into a conversational 25–30 minute listen."
      author: "Dispatch"
      itunes_category: "Technology"
      cron: "0 5 * * sat"
      compose_window_days: 7
      enabled: true
