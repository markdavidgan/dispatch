# Dispatch project registry — order matters.
# Active projects render first, held next, archived hidden from home.

version: 1
timezone: UTC

projects:
  - slug: claude-code
    display_name: Claude Code
    github: anthropics/claude-code
    status: active
    kind: tool
    summary: Anthropic's official command-line interface for Claude. Active daily; pairs an AI agent with the developer's terminal, repo, and IDE integrations.

  - slug: astro
    display_name: Astro
    github: withastro/astro
    status: active
    kind: app
    summary: All-in-one web framework for content-driven sites. Steady weekly cadence with a healthy mix of feature PRs, releases, and docs work.

  - slug: hydrogen
    display_name: Hydrogen
    github: Shopify/hydrogen
    status: active
    kind: app
    summary: Shopify's React-based framework for building custom storefronts. Powers headless commerce with tight Remix integration.

  - slug: metaflow
    display_name: Metaflow
    github: Netflix/metaflow
    status: active
    kind: tool
    summary: Netflix's human-centric framework for building and managing real-life AI and ML systems. Covers the full lifecycle from notebook prototyping to production deployments.

  - slug: mantis
    display_name: Mantis
    github: Netflix/mantis
    status: active
    kind: service
    summary: Netflix's platform for building realtime, cost-effective, operations-focused stream processing applications.

  - slug: ai-sdk
    display_name: AI SDK
    github: vercel/ai
    status: active
    kind: tool
    summary: Vercel's provider-agnostic TypeScript toolkit for building AI-powered applications and agents. Supports Next.js, React, Svelte, Vue, and Node.js.

  - slug: workflow-sdk
    display_name: Workflow SDK
    github: vercel/workflow
    status: active
    kind: tool
    summary: Vercel's SDK for building durable, reliable, and observable apps and AI agents in TypeScript.

  - slug: gemma-cpp
    display_name: Gemma.cpp
    github: google/gemma.cpp
    status: active
    kind: tool
    summary: Google's lightweight C++ inference engine for the Gemma open models. Runs LLMs efficiently on CPU with minimal dependencies.

  - slug: dispatch-weekly
    display_name: Dispatch Weekly
    status: active
    kind: meta
    summary: Cross-project weekly podcast — NotebookLM composes one 25–30 minute episode from the week's daily briefings, surfacing themes that span projects rather than reciting per-day activity.
    podcast:
      title: "Dispatch Weekly"
      description: "Weekly cross-project digest. One episode picks the best insights from every project Dispatch tracks, woven into a conversational 25–30 minute listen."
      author: "Dispatch"
      itunes_category: "Technology"
      cron: "0 1 * * mon"
      compose_window_days: 7
      enabled: true
