# Dispatch project registry — order matters.
# Active projects render first, held next, archived hidden from home.
#
# display_name resolution order (see apps/backend/dispatch/registry/resolve.py):
#   1. Explicit `display_name` here (this file is the override layer)
#   2. First H1 of `<local_path>/README.md` (auto-discovered)
#   3. Titleize slug, respecting acronyms in acronyms.yml
#
# Editing this file by hand is the manual workflow; the planned Console
# registry editor will surface CRUD over these entries.
version: 1
timezone: Asia/Manila

projects:
  - slug: agos
    display_name: AGOS
    github: markdavidgan/agos
    local_path: /repos/agos
    status: active
    kind: app
    summary: Adaptive Gated Observational System — a research-first systematic crypto trading project. The loop is the product.
    podcast:
      title: "AGOS Dev"
      description: "Weekly engineering podcast for AGOS, a systematic crypto trading research project."
      author: "Mark"
      itunes_category: "Technology"
      cover_art: "apps/backend/dispatch/podcast/assets/agos/cover.jpg"
      cron: "0 5 * * sat"
      compose_window_days: 7
      enabled: true

  - slug: aether-focus
    display_name: Made with Aether
    github: markdavidgan/aether-focus
    local_path: /repos/aether-focus
    status: active
    kind: app
    summary: Apps designed for focus, clarity, and flow — monorepo for madewithaether.com. Ember, Cadence, Cue, Arc, Drift, Folio for iOS, macOS, and watchOS 26+.
    podcast:
      title: "Aether Dev"
      description: "Weekly engineering podcast for the Made with Aether suite of productivity apps."
      author: "Aether Team"
      itunes_category: "Technology"
      cover_art: "apps/backend/dispatch/podcast/assets/aether-focus/cover.jpg"
      cron: "0 5 * * sat"
      compose_window_days: 7
      enabled: true

