services:
  dispatch-backend:
    build:
      context: apps/backend
      dockerfile: Dockerfile
    container_name: dispatch-backend
    ports:
      - "10060:10060"
    volumes:
      - dispatch-data:/data
      - dispatch-kimi-cache:/home/dispatch/.kimi
      - /opt/dispatch-demo/gcp-sa.json:/etc/dispatch/gcp-sa.json:ro
    environment:
      - HOST=0.0.0.0
      - PORT=10060
      - DB_PATH=/data/dispatch.db
      - DISPATCH_TZ=Asia/Manila
      - DISPATCH_MASTER_KEY=${DISPATCH_MASTER_KEY:?DISPATCH_MASTER_KEY must be set}
      - GOOGLE_APPLICATION_CREDENTIALS=/etc/dispatch/gcp-sa.json
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - R2_PUBLIC_BASE_URL=${R2_PUBLIC_BASE_URL:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - CLOUDFLARE_API_KEY=${CLOUDFLARE_API_KEY:-}
      - CLOUDFLARE_EMAIL=${CLOUDFLARE_EMAIL:-}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-}
      - GCP_TTS_LANGUAGE_CODE=${GCP_TTS_LANGUAGE_CODE:-}
      - GCP_TTS_VOICE=${GCP_TTS_VOICE:-}
      - KIMI_OAUTH_JSON=${KIMI_OAUTH_JSON:-}
      - PODCAST_BASE_URL=${PODCAST_BASE_URL:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:10060/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  dispatch-frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      # Build context includes both apps/frontend (for the SPA source)
      # and caddy/ (for the Caddyfile). We mount it from the repo root.
    container_name: dispatch-frontend
    ports:
      - "${DISPATCH_HTTP_PORT:-8080}:80"
    depends_on:
      dispatch-backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dispatch-data:
  dispatch-kimi-cache:
